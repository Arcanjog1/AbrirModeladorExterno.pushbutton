<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Visualizador de Modulação Externa</title>
<style>
  html, body { margin: 0; height: 100%; font-family: Segoe UI, Arial, sans-serif; background: #1b1d21; color: #e8e8e8; }
  #app { display: flex; height: 100%; }
  #sidebar { width: 380px; flex-shrink: 0; padding: 16px; box-sizing: border-box; overflow-y: auto; background: #202226; border-right: 1px solid #333; }
  #viewport { flex-grow: 1; position: relative; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #aaa; margin-top: 10px; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 6px 8px; background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; margin-top: 4px; }
  button { margin-top: 10px; padding: 8px 12px; background: #2f6fed; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #4783ff; }
  button.secondary { background: #444; }
  button.secondary:hover { background: #555; }
  #status { font-size: 12px; color: #ffb454; margin-top: 10px; white-space: pre-wrap; }
  #layers-list { font-size: 12px; margin-top: 8px; }
  .layer-row { border-bottom: 1px solid #333; padding: 6px 0; }
  .layer-row .layer-name { font-weight: bold; }
  .layer-row.ok .layer-name::before { content: "[OK] "; color: #8ee08e; }
  .layer-row.atencao .layer-name::before { content: "[ATENÇÃO] "; color: #ffb454; }
  .layer-row .layer-detail { color: #999; }
  .wall-row { border-bottom: 1px solid #333; padding: 8px 0; font-size: 12px; cursor: pointer; }
  .wall-row:hover { background: #26282c; }
  .wall-row.ok { color: #8ee08e; }
  .wall-row.bad { color: #ff9d9d; }
  .wall-row .blocks { color: #ccc; }
  #summary { font-size: 12px; margin-top: 12px; padding: 8px; background: #26282c; border-radius: 4px; }
  #validation-banner { font-size: 12px; margin-top: 12px; padding: 10px; border-radius: 4px; background: #3a2a1a; border: 1px solid #a35a1a; color: #ffcf8e; white-space: pre-wrap; }
  #validation-banner:empty { display: none; }
  canvas { display: block; }
  #legend { position: absolute; bottom: 12px; left: 12px; font-size: 12px; background: rgba(0,0,0,0.5); padding: 8px 10px; border-radius: 4px; }
  #legend span { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: middle; }
  #view-toolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 2; }
  #view-toolbar button { margin-top: 0; padding: 6px 10px; font-size: 12px; background: #333; }
  #view-toolbar button:hover { background: #444; }
  #nav-hint { position: absolute; bottom: 12px; right: 12px; font-size: 11px; color: #888; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ddd; margin-top: 4px; }
  .checkbox-row input { width: auto; margin: 0; }
  #layer-toggles { max-height: 140px; overflow-y: auto; margin-top: 4px; background: #111; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; }
  #layer-toggles .hint { font-size: 12px; color: #777; }
  #selection-panel { position: absolute; top: 54px; right: 12px; z-index: 3; width: min(320px, calc(100% - 24px)); box-sizing: border-box; font-size: 12px; padding: 10px; background: rgba(32,34,38,0.96); border: 1px solid #444; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  #selection-panel:empty { display: none; }
  #selection-panel .sel-title { font-weight: bold; color: #8fc7ff; margin-bottom: 4px; }
  #selection-panel .sel-row { color: #ccc; }
  #opening-context-menu { position: absolute; z-index: 5; min-width: 230px; padding: 6px; background: rgba(28,30,34,0.98); border: 1px solid #555; border-radius: 4px; box-shadow: 0 10px 28px rgba(0,0,0,0.45); display: none; }
  #opening-context-menu button { display: block; width: 100%; margin: 0; padding: 7px 9px; text-align: left; background: transparent; color: #eee; border: 0; border-radius: 3px; }
  #opening-context-menu button:hover { background: #353941; }
  #opening-context-menu .menu-separator { height: 1px; background: #444; margin: 5px 2px; }
  @media (max-width: 700px) {
    html, body { height: auto; min-height: 100%; overflow-x: hidden; }
    #app { display: block; height: auto; min-height: 100%; }
    #sidebar { width: 100%; max-height: none; border-right: 0; border-bottom: 1px solid #333; }
    #viewport { width: 100%; height: 65vh; min-height: 420px; }
    #view-toolbar { right: 12px; flex-wrap: wrap; }
    #view-toolbar button { padding: 6px 8px; }
    #nav-hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Modulação externa — visualizador local</h1>

    <button id="btn-pick-dwg">Selecionar DWG</button>
    <button id="btn-pick-json" style="background:#00897b; margin-top:6px;">Selecionar Captura do Revit (JSON)</button>

    <label>Caminho do arquivo (DXF ou JSON)</label>
    <input type="text" id="dxf-path" placeholder="C:\caminho\para\captura.json ou planta.dxf">

    <label>Layer(s) das paredes (separadas por vírgula, opcional)</label>
    <input type="text" id="wall-layers" placeholder="A-WALL, ARQ-PAREDE">

    <label>Unidade/escala do desenho</label>
    <select id="unit-scale">
      <option value="">Automático (cabeçalho $INSUNITS do DXF)</option>
      <option value="1">Já está em centímetros (1cm = 1cm)</option>
      <option value="0.1">Milímetros (1mm = 0.1cm)</option>
      <option value="100">Metros (1m = 100cm)</option>
      <option value="2.54">Polegadas</option>
      <option value="30.48">Pés</option>
    </select>

    <button id="btn-layers" class="secondary">Analisar layers do arquivo</button>
    <div id="layers-list"></div>

    <button id="btn-load">Gerar modulação</button>
    <button id="btn-auto-adjust" class="secondary" disabled>Ajuste automático</button>

    <div id="status"></div>
    <div id="validation-banner"></div>
    <div id="summary"></div>

    <label>Modos de visualização</label>
    <div id="view-modes">
      <label class="checkbox-row"><input type="checkbox" id="mode-plan" checked> Planta CAD / Referência</label>
      <label class="checkbox-row"><input type="checkbox" id="mode-walls" checked> Walls</label>
      <label class="checkbox-row"><input type="checkbox" id="mode-blocks" checked> Blocos</label>
      <label class="checkbox-row"><input type="checkbox" id="mode-openings" checked> Aberturas (Portas/Janelas)</label>
      <label class="checkbox-row"><input type="checkbox" id="mode-axes"> Eixos</label>
      <label class="checkbox-row"><input type="checkbox" id="mode-errors" checked> Paredes com erro</label>
    </div>

    <label>Camadas do DXF</label>
    <div id="layer-toggles"><span class="hint">Carregue um DXF para listar as camadas.</span></div>

  </div>
  <div id="viewport">
    <div id="selection-panel"></div>
    <div id="opening-context-menu">
      <button type="button" data-opening-preview="auto">Ajustar automaticamente para modulação</button>
      <button type="button" data-opening-preview="-5">Visualizar mover -5cm</button>
      <button type="button" data-opening-preview="-1">Visualizar mover -1cm</button>
      <button type="button" data-opening-preview="1">Visualizar mover +1cm</button>
      <button type="button" data-opening-preview="5">Visualizar mover +5cm</button>
      <div class="menu-separator"></div>
      <button type="button" data-opening-apply-preview>Aplicar preview</button>
      <button type="button" data-opening-cancel-preview>Cancelar preview</button>
    </div>
    <div id="view-toolbar">
      <button class="view-btn" id="view-top">Topo</button>
      <button class="view-btn" id="view-front">Frente</button>
      <button class="view-btn" id="view-side">Lateral</button>
      <button class="view-btn" id="view-iso">Isométrica</button>
      <button class="view-btn" id="view-extents">Zoom Extents</button>
    </div>
    <div id="legend">
      <div><span style="background:#4caf50"></span>fecha em blocos</div>
      <div><span style="background:#e53935"></span>não fecha / face única</div>
      <div><span style="background:#5588cc"></span>planta DXF (referência)</div>
    </div>
    <div id="nav-hint">Esquerdo: selecionar · Scroll: zoom · Meio: pan · Shift+Meio: orbit</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d21);

const camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 1, 100000);
camera.position.set(0, -800, 900);
camera.up.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
viewport.appendChild(renderer.domElement);
const canvasEl = renderer.domElement;
canvasEl.addEventListener('contextmenu', e => e.preventDefault());

const controls = new THREE.OrbitControls(camera, canvasEl);
controls.target.set(0, 0, 0);

// --- Navegação estilo Revit: esquerdo seleciona (não move a câmera),
// scroll dá zoom (padrão do OrbitControls, já ativo), botão do meio faz
// pan, Shift + botão do meio orbita. Registrado ANTES de criar o
// OrbitControls (mesmo alvo, fase de bubble) para decidir a ação do botão
// do meio a cada novo clique, antes do listener interno dele rodar. ---
canvasEl.addEventListener('pointerdown', (e) => {
  if (e.button === 1) {
    controls.mouseButtons.MIDDLE = e.shiftKey ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
  }
});
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: null };

const grid = new THREE.GridHelper(2000, 40, 0x444444, 0x2a2a2a);
grid.rotation.x = Math.PI / 2;
scene.add(grid);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(300, -500, 800);
scene.add(dirLight);

const wallGroup = new THREE.Group(); scene.add(wallGroup);
const axesGroup = new THREE.Group(); axesGroup.visible = false; scene.add(axesGroup);
const blocksGroup = new THREE.Group(); scene.add(blocksGroup);
const openingsGroup = new THREE.Group(); scene.add(openingsGroup);
const planGroup = new THREE.Group(); scene.add(planGroup);
const planLayerGroups = {}; // nome do layer -> THREE.Group (filho de planGroup)

const WALL_HEIGHT_CM = 280;

let currentWalls = [];
let currentEntities = [];
let currentOpenings = [];
let currentBlockCandidates = [];
let currentCatalog = {};
let currentModelId = null;
let selectedOpeningId = null;
let selectedWallId = null;
let committedViewData = null;
let activePreviewAction = null;
let lastBounds = null;
let editSession = null;

function clearGroup(group) {
  while (group.children.length) {
    const child = group.children.pop();
    if (child.children && child.children.length) clearGroup(child);
    if (child.geometry) child.geometry.dispose();
    if (Array.isArray(child.material)) child.material.forEach(material => material.dispose());
    else if (child.material) child.material.dispose();
  }
}

function resetWalls() {
  clearGroup(wallGroup);
  clearGroup(axesGroup);
  clearGroup(blocksGroup);
  clearGroup(openingsGroup);
}

function resetPlan() {
  clearGroup(planGroup);
  Object.keys(planLayerGroups).forEach(k => delete planLayerGroups[k]);
}

function layerColor(name) {
  // cor deterministica (hash simples do nome) - so' para diferenciar
  // visualmente camadas na planta de referencia, sem nenhum significado
  // semantico.
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return new THREE.Color(`hsl(${h % 360}, 55%, 55%)`);
}

function blockColor(blockLengthCm) {
  if (blockLengthCm >= 39) return 0x63bd6f;
  if (blockLengthCm >= 34) return 0x56a9c9;
  if (blockLengthCm >= 19) return 0x8ac15c;
  return 0xc6b85c;
}

function rgbColor(rgb, fallback = 0xaaaaaa) {
  if (!rgb || rgb.length < 3) return fallback;
  return ((rgb[0] & 255) << 16) | ((rgb[1] & 255) << 8) | (rgb[2] & 255);
}

function blockShellParts(candidate) {
  const length = candidate.length_cm;
  const width = candidate.width_cm;
  const holes = (candidate.cells_local_cm || []).map(cell => {
    const center = cell.center_cm || [0, 0];
    const size = cell.size_cm || [0, 0];
    return {
      x0: Math.max(-length / 2, center[0] - size[0] / 2),
      x1: Math.min(length / 2, center[0] + size[0] / 2),
      y0: Math.max(-width / 2, center[1] - size[1] / 2),
      y1: Math.min(width / 2, center[1] + size[1] / 2),
    };
  }).filter(hole => hole.x1 - hole.x0 > 0.05 && hole.y1 - hole.y0 > 0.05);
  if (!holes.length) return [{ center_cm: [0, 0], size_cm: [length, width] }];

  const uniqueSorted = values => [...new Set(values.map(value => value.toFixed(4)))]
    .map(Number).sort((a, b) => a - b);
  const xs = uniqueSorted([-length / 2, length / 2, ...holes.flatMap(h => [h.x0, h.x1])]);
  const ys = uniqueSorted([-width / 2, width / 2, ...holes.flatMap(h => [h.y0, h.y1])]);
  const parts = [];
  for (let yi = 0; yi < ys.length - 1; yi++) {
    const y0 = ys[yi], y1 = ys[yi + 1], cy = (y0 + y1) / 2;
    let solidStart = null;
    for (let xi = 0; xi < xs.length - 1; xi++) {
      const x0 = xs[xi], x1 = xs[xi + 1], cx = (x0 + x1) / 2;
      const isHole = holes.some(h => cx > h.x0 && cx < h.x1 && cy > h.y0 && cy < h.y1);
      if (!isHole && solidStart === null) solidStart = x0;
      if ((isHole || xi === xs.length - 2) && solidStart !== null) {
        const solidEnd = isHole ? x0 : x1;
        if (solidEnd - solidStart > 0.05) {
          parts.push({
            center_cm: [(solidStart + solidEnd) / 2, cy],
            size_cm: [solidEnd - solidStart, y1 - y0],
          });
        }
        solidStart = null;
      }
    }
  }
  return parts;
}

function renderSolvedBlocks(candidates) {
  clearGroup(blocksGroup);
  const buckets = new Map();
  (candidates || []).forEach(candidate => {
    blockShellParts(candidate).forEach((part, partIndex) => {
      const size = part.size_cm;
      const color = rgbColor(candidate.color_rgb);
      const key = `${size[0].toFixed(3)}|${size[1].toFixed(3)}|${candidate.height_cm.toFixed(3)}|${color}`;
      if (!buckets.has(key)) buckets.set(key, { size, color, entries: [] });
      buckets.get(key).entries.push({ candidate, part, partIndex });
    });
  });

  const matrix = new THREE.Matrix4();
  const quaternion = new THREE.Quaternion();
  const scale = new THREE.Vector3(1, 1, 1);
  buckets.forEach(bucket => {
    const geometry = new THREE.BoxGeometry(
      Math.max(0.2, bucket.size[0]),
      Math.max(0.2, bucket.size[1]),
      bucket.entries[0].candidate.height_cm
    );
    const material = new THREE.MeshLambertMaterial({ color: bucket.color });
    const mesh = new THREE.InstancedMesh(geometry, material, bucket.entries.length);
    mesh.userData = { kind: 'block-instances', instances: bucket.entries };
    bucket.entries.forEach((entry, index) => {
      const candidate = entry.candidate;
      const local = entry.part.center_cm || [0, 0];
      const xDir = candidate.x_dir || [1, 0];
      const yDir = candidate.y_dir || [0, 1];
      const x = candidate.origin_cm[0] + xDir[0] * local[0] + yDir[0] * local[1];
      const y = candidate.origin_cm[1] + xDir[1] * local[0] + yDir[1] * local[1];
      const z = candidate.z_cm + candidate.height_cm / 2;
      quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.atan2(xDir[1], xDir[0]));
      matrix.compose(new THREE.Vector3(x, y, z), quaternion, scale);
      mesh.setMatrixAt(index, matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    blocksGroup.add(mesh);
  });
}

function addBlockPreviewBoxes(wall, length, thickness, height, baseZ, angle, centerX, centerY) {
  const blocks = wall.modulation && wall.modulation.blocks;
  if (!blocks || !blocks.length) return;

  const joint = 1;
  const courseHeight = 19;
  const courseJoint = 1;
  const courseCount = Math.max(1, Math.floor((height + courseJoint) / (courseHeight + courseJoint)));
  const boundary = wall.modulation.boundary_joints_cm || [0, 0];

  for (let course = 0; course < courseCount; course++) {
    const z0 = baseZ + course * (courseHeight + courseJoint);
    if (z0 >= baseZ + height) break;
    const h = Math.min(courseHeight, baseZ + height - z0);
    let offset = -length / 2 + (boundary[0] || 0);
    const row = course % 2 ? blocks.slice().reverse() : blocks;

    row.forEach((blockLength, index) => {
      if (offset >= length / 2) return;
      const usableLength = Math.min(blockLength, length / 2 - offset);
      if (usableLength <= 2) return;
      const geom = new THREE.BoxGeometry(Math.max(2, usableLength - 0.6), Math.max(2, thickness - 0.6), h);
      const mat = new THREE.MeshLambertMaterial({
        color: blockColor(blockLength),
        transparent: true,
        opacity: 0.92,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.set(centerX, centerY, z0 + h / 2);
      mesh.position.x += Math.cos(angle) * (offset + usableLength / 2);
      mesh.position.y += Math.sin(angle) * (offset + usableLength / 2);
      mesh.rotation.z = angle;
      mesh.userData = { kind: 'block', wall, blockLength, course };
      blocksGroup.add(mesh);

      const edges = new THREE.EdgesGeometry(geom);
      const edge = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x153018, opacity: 0.55, transparent: true }));
      edge.position.copy(mesh.position);
      edge.rotation.copy(mesh.rotation);
      blocksGroup.add(edge);
      offset += usableLength + (index < row.length - 1 ? joint : 0);
    });
  }
}

function addWallSolid(wall, segment, materialInfo) {
  const [x0, y0] = segment.start;
  const [x1, y1] = segment.end;
  const dx = x1 - x0, dy = y1 - y0;
  const length = Math.sqrt(dx * dx + dy * dy);
  const angle = Math.atan2(dy, dx);
  const thickness = wall.thickness_cm;
  const height = segment.height_cm || wall.height_cm || WALL_HEIGHT_CM;
  const baseZ = segment.base_z_cm || wall.base_z_cm || 0;

  const geometry = new THREE.BoxGeometry(length, thickness, height);
  const material = new THREE.MeshLambertMaterial({
    color: materialInfo.color,
    transparent: true,
    opacity: materialInfo.opacity,
  });
  const mesh = new THREE.Mesh(geometry, material);
  const centerX = (x0 + x1) / 2;
  const centerY = (y0 + y1) / 2;
  mesh.position.set(centerX, centerY, baseZ + height / 2);
  mesh.rotation.z = angle;
  mesh.userData = { kind: 'wall', wall, isError: materialInfo.isError };
  wallGroup.add(mesh);

  const edges = new THREE.EdgesGeometry(geometry);
  const edgeLine = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.4, transparent: true }));
  edgeLine.position.copy(mesh.position);
  edgeLine.rotation.copy(mesh.rotation);
  edgeLine.userData = { kind: 'wall-edge', isError: materialInfo.isError };
  wallGroup.add(edgeLine);
}

function addWallBox(wall) {
  const [x0, y0] = wall.start;
  const [x1, y1] = wall.end;
  const dx = x1 - x0, dy = y1 - y0;
  const length = Math.sqrt(dx * dx + dy * dy);
  const angle = Math.atan2(dy, dx);
  const thickness = wall.thickness_cm;
  const height = wall.height_cm || WALL_HEIGHT_CM;
  const baseZ = wall.base_z_cm || 0;
  const closes = wall.modulation && wall.modulation.closes;
  const solverStatus = wall.modulation_status || {};
  const isError = wall.single_line || !closes || solverStatus.ok === false;
  const blocks = wall.modulation && wall.modulation.blocks;
  const materialInfo = {
    color: wall.single_line || solverStatus.ok === false ? 0xe53935 : (closes ? 0x4caf50 : 0xe53935),
    opacity: blocks ? 0.18 : 0.85,
    isError,
  };

  const solids = wall.cutout_segments && wall.cutout_segments.length
    ? wall.cutout_segments
    : [wall];
  solids.forEach(segment => addWallSolid(wall, segment, materialInfo));

  // eixo da parede (referência no plano do chão)
  const axisGeom = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x0, y0, 1), new THREE.Vector3(x1, y1, 1),
  ]);
  axesGroup.add(new THREE.Line(axisGeom, new THREE.LineBasicMaterial({ color: 0xffdd55 })));

  // divisões de blocos (aproximado: soma cumulativa dos comprimentos de
  // wall.modulation.blocks, sem contar juntas separadamente - referência
  // visual, não um desenho de execução).
  if (!currentBlockCandidates.length) {
    addBlockPreviewBoxes(wall, length, thickness, height, baseZ, angle, centerX, centerY);
  }

  if (blocks && blocks.length > 1) {
    let offset = -length / 2;
    const boundaryMat = new THREE.LineBasicMaterial({ color: 0x1a1a1a });
    for (let i = 0; i < blocks.length - 1; i++) {
      offset += blocks[i];
      const pts = [
        new THREE.Vector3(offset, -thickness / 2, 0),
        new THREE.Vector3(offset, thickness / 2, 0),
        new THREE.Vector3(offset, thickness / 2, height),
        new THREE.Vector3(offset, -thickness / 2, height),
        new THREE.Vector3(offset, -thickness / 2, 0),
      ];
      const boundaryLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), boundaryMat);
      boundaryLine.position.set((x0 + x1) / 2, (y0 + y1) / 2, baseZ);
      boundaryLine.rotation.z = angle;
      blocksGroup.add(boundaryLine);
    }
  }
}

function addPlanEntity(entity) {
  const [x0, y0] = entity.start;
  const [x1, y1] = entity.end;
  if (!planLayerGroups[entity.layer]) {
    const g = new THREE.Group();
    planGroup.add(g);
    planLayerGroups[entity.layer] = g;
  }
  const geom = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x0, y0, 0), new THREE.Vector3(x1, y1, 0),
  ]);
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color: layerColor(entity.layer) }));
  line.userData = { kind: 'entity', entity };
  planLayerGroups[entity.layer].add(line);
}

function buildLayerToggles(entities) {
  const layers = [...new Set(entities.map(e => e.layer))].sort();
  const container = document.getElementById('layer-toggles');
  if (!layers.length) {
    container.innerHTML = '<span class="hint">Nenhuma camada encontrada.</span>';
    return;
  }
  container.innerHTML = layers.map(l =>
    `<label class="checkbox-row"><input type="checkbox" class="layer-toggle" data-layer="${l}" checked> ${l}</label>`
  ).join('');
  container.querySelectorAll('.layer-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      const g = planLayerGroups[cb.dataset.layer];
      if (g) g.visible = cb.checked;
      requestRender();
    });
  });
}

function applyWallVisibility() {
  const showOk = document.getElementById('mode-walls').checked;
  const showErr = document.getElementById('mode-errors').checked;
  wallGroup.children.forEach(c => { c.visible = c.userData.isError ? showErr : showOk; });
  requestRender();
}

function frameCamera(walls, entities) {
  const points = [];
  (walls || []).forEach(w => { points.push(w.start, w.end); });
  (entities || []).forEach(e => { points.push(e.start, e.end); });
  if (!points.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  points.forEach(([x, y]) => {
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const span = Math.max(maxX - minX, maxY - minY, 200);
  const maxHeight = Math.max(...(walls || []).map(w => (w.base_z_cm || 0) + (w.height_cm || WALL_HEIGHT_CM)), WALL_HEIGHT_CM);
  lastBounds = { cx, cy, cz: maxHeight / 2, span };
  controls.target.set(cx, cy, maxHeight / 2);
  camera.position.set(cx, cy - span * 1.2, span * 1.1);
  camera.up.set(0, 0, 1);
  controls.update();
}

function setView(kind) {
  const b = lastBounds || { cx: 0, cy: 0, cz: WALL_HEIGHT_CM / 2, span: 500 };
  controls.target.set(b.cx, b.cy, b.cz);
  const span = b.span;
  if (kind === 'top') {
    // deslocamento minusculo em Y evita a direcao da camera ficar paralela
    // a camera.up=(0,0,1) (caso degenerado exatamente de topo).
    camera.position.set(b.cx, b.cy + span * 0.001, b.cz + span * 1.6);
  } else if (kind === 'front') {
    camera.position.set(b.cx, b.cy - span * 1.6, b.cz);
  } else if (kind === 'side') {
    camera.position.set(b.cx - span * 1.6, b.cy, b.cz);
  } else if (kind === 'iso') {
    camera.position.set(b.cx - span * 1.1, b.cy - span * 1.1, b.cz + span * 1.1);
  }
  camera.up.set(0, 0, 1);
  camera.lookAt(controls.target);
  controls.update();
}

function focusOnWallId(wallId) {
  const wall = currentWalls.find(w => w.id === wallId);
  if (!wall) return;
  const mesh = wallGroup.children.find(c => c.userData.kind === 'wall' && c.userData.wall.id === wallId);
  if (mesh) selectObject(mesh);
  const [x0, y0] = wall.start, [x1, y1] = wall.end;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const span = Math.max(wall.length_cm, wall.thickness_cm * 4, 150);
  controls.target.set(cx, cy, WALL_HEIGHT_CM / 2);
  camera.position.set(cx, cy - span * 1.4, span + WALL_HEIGHT_CM / 2);
  camera.up.set(0, 0, 1);
  controls.update();
}

// --- Seleção por clique (esquerdo) ---
const raycaster = new THREE.Raycaster();
raycaster.params.Line.threshold = 3;
const mouseNdc = new THREE.Vector2();
let mouseDownPos = null;
let selectedObject = null;
let selectedOriginalColor = null;

function clearSelectionHighlight() {
  if (selectedObject && selectedObject.material && selectedObject.material.color && selectedOriginalColor) {
    selectedObject.material.color.copy(selectedOriginalColor);
  }
  selectedObject = null;
  selectedOriginalColor = null;
  selectedOpeningId = null;
  selectedWallId = null;
  hideOpeningContextMenu();
  document.getElementById('btn-auto-adjust').disabled = !currentModelId;

function selectObject(obj, instanceId = null) {
  clearSelectionHighlight();
  selectedObject = obj;
  if (obj.userData.kind !== 'block-instances' && obj.material && obj.material.color) {
    selectedOriginalColor = obj.material.color.clone();
    obj.material.color.set(0xffffff);
  }
  const panel = document.getElementById('selection-panel');
  if (obj.userData.kind === 'wall') {
    const w = obj.userData.wall;
    const mod = w.modulation || {};
    const solverStatus = w.modulation_status || {};
    selectedWallId = String(w.id || '');
    panel.innerHTML = `<div class="sel-title">Parede ${w.id}</div>`
      + `<div class="sel-row">Layer: ${w.layer}</div>`
      + `<div class="sel-row">Comprimento: ${w.length_cm.toFixed(1)}cm</div>`
      + `<div class="sel-row">Altura: ${(w.height_cm || 0).toFixed(1)}cm · Largura: ${w.thickness_cm.toFixed(1)}cm</div>`
      + `<div class="sel-row">Nível de base: ${w.level || '-'}</div>`
      + `<div class="sel-row">Elevação: ${(w.base_z_cm || 0).toFixed(1)}cm · Offset: ${(w.base_offset_cm || 0).toFixed(1)}cm</div>`
      + `<div class="sel-row">Junções: ${(w.junctions || []).map(j => j || '-').join(' / ')}</div>`
      + `<div class="sel-row">Modulação: ${mod.closes ? 'fecha' : 'não fecha'}`
      + `${mod.blocks ? ' (' + mod.blocks.join('+') + 'cm)' : ''}</div>`
      + (solverStatus.reason ? `<div class="sel-row">Diagnóstico: ${solverStatus.reason}</div>` : '')
      + (!mod.closes ? `<div class="sel-row">Conflito: comprimento ou encontro exige revisão pelo solver.</div>` : '')
      + (currentModelId ? `<div class="sel-row" style="margin-top:8px"><button type="button" data-wall-edit="move" class="secondary">Arrastar parede</button> <button type="button" data-wall-edit="start" class="secondary">Arrastar início</button> <button type="button" data-wall-edit="end" class="secondary">Arrastar fim</button></div>` : '');
  } else if (obj.userData.kind === 'opening') {
    const op = obj.userData.opening;
    selectedOpeningId = String(op.element_id || '');
    document.getElementById('btn-auto-adjust').disabled = !currentModelId;
    panel.innerHTML = `<div class="sel-title">Abertura ${op.element_id || ''}</div>`
      + `<div class="sel-row">Tipo: ${op.type || op.family || 'não informado'}</div>`
      + `<div class="sel-row">Largura: ${(op.width_cm || 0).toFixed(1)}cm · Altura: ${((op.height_cm || 0) || ((op.head_cm || 0) - (op.sill_cm || 0))).toFixed(1)}cm</div>`
      + `<div class="sel-row">Base: ${(op.sill_cm || 0).toFixed(1)}cm · Verga: ${(op.head_cm || 0).toFixed(1)}cm</div>`
      + `<div class="sel-row">Nível: ${op.level || '-'}</div>`
      + `<div class="sel-row">Parede associada: ${op.wall_group_id || op.host_wall_id || op.wall_id || '-'}</div>`
      + `<div class="sel-row" style="margin-top:8px">`
      + `<button type="button" data-opening-shift="-1" class="secondary">Mover -1cm</button> `
      + `<button type="button" data-opening-shift="1" class="secondary">Mover +1cm</button>`
      + (currentModelId ? ` <button type="button" data-opening-edit="move" class="secondary">Arrastar abertura</button>` : '')
      + `</div>`;
  } else if (obj.userData.kind === 'block-instances') {
    const entry = obj.userData.instances[instanceId];
    const block = entry.candidate;
    panel.innerHTML = `<div class="sel-title">${block.type_name || ('Bloco ' + block.logical_code)}</div>`
      + `<div class="sel-row">Código: ${block.logical_code}</div>`
      + `<div class="sel-row">Dimensões: ${block.length_cm.toFixed(1)} × ${block.width_cm.toFixed(1)} × ${block.height_cm.toFixed(1)}cm</div>`
      + `<div class="sel-row">Posição: ${block.origin_cm[0].toFixed(1)}, ${block.origin_cm[1].toFixed(1)}, ${block.z_cm.toFixed(1)}cm</div>`
      + `<div class="sel-row">Nível: ${block.level || '-'} · Fiada ${block.course_index + 1} (${block.course})</div>`
      + `<div class="sel-row">Parede: ${block.wall_id || 'encontro'} · ${block.placement_reason || 'preenchimento'}</div>`;
  } else if (obj.userData.kind === 'entity') {
    const e = obj.userData.entity;
    const dx = e.end[0] - e.start[0], dy = e.end[1] - e.start[1];
    const len = Math.sqrt(dx * dx + dy * dy);
    panel.innerHTML = `<div class="sel-title">Entidade do DXF</div>`
      + `<div class="sel-row">Layer: ${e.layer}</div>`
      + `<div class="sel-row">Tipo: ${e.entity_type}</div>`
      + `<div class="sel-row">Comprimento: ${len.toFixed(1)}cm</div>`
      + `<div class="sel-row">Origem DXF: (${e.start[0].toFixed(1)}, ${e.start[1].toFixed(1)}) → `
      + `(${e.end[0].toFixed(1)}, ${e.end[1].toFixed(1)})</div>`
      + `<div class="sel-row">Wall associada: ${e.wall_id || 'nenhuma (fora de uma layer de parede analisada, ou parede sem par)'}</div>`;
  }
  requestRender();
}

canvasEl.addEventListener('mousedown', (e) => { mouseDownPos = [e.clientX, e.clientY]; });
function pickObjectAt(clientX, clientY) {
  const rect = canvasEl.getBoundingClientRect();
  mouseNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouseNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNdc, camera);

  const pickables = [];
  if (wallGroup.visible) {
    wallGroup.children.forEach(c => { if (c.userData.kind === 'wall' && c.visible) pickables.push(c); });
  }
  if (openingsGroup.visible) {
    openingsGroup.children.forEach(c => { if (c.userData.kind === 'opening' && c.visible) pickables.push(c); });
  }
  if (blocksGroup.visible) {
    blocksGroup.children.forEach(c => { if (c.userData.kind === 'block-instances' && c.visible) pickables.push(c); });
  }
  if (planGroup.visible) {
    Object.values(planLayerGroups).forEach(g => { if (g.visible) g.children.forEach(c => pickables.push(c)); });
  }
  const hits = raycaster.intersectObjects(pickables, false);
  if (hits.length) {
    return hits.find(hit => hit.object.userData.kind === 'opening')
      || hits.find(hit => hit.object.userData.kind === 'block-instances')
      || hits[0];
  }
  return null;
}

function worldPointAt(clientX, clientY) {
  const rect = canvasEl.getBoundingClientRect();
  mouseNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouseNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNdc, camera);
  const point = new THREE.Vector3();
  return raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), point) ? point : null;
}

function beginWallEdit(mode) {
  const wall = currentWalls.find(item => String(item.id || '') === selectedWallId);
  if (!wall || !currentModelId) return;
  editSession = { kind: 'wall', mode, wall, pointerStart: null };
  setStatus(`Arraste no modelo para ${mode === 'move' ? 'mover a parede' : (mode === 'start' ? 'reposicionar o início' : 'reposicionar o fim')}. A modulação será recalculada ao soltar.`);
}

function beginOpeningEdit() {
  const opening = currentOpenings.find(item => String(item.element_id || '') === selectedOpeningId);
  if (!opening || !currentModelId) return;
  editSession = { kind: 'opening', opening, pointerStart: null };
  setStatus('Arraste no modelo para mover a abertura ao longo da parede. A modulação será recalculada ao soltar.');
}

async function commitInteractiveEdit(session, point) {
  if (!currentModelId || !point) return;
  let endpoint;
  let body;
  if (session.kind === 'wall') {
    const [x0, y0] = session.wall.start;
    const [x1, y1] = session.wall.end;
    const dx = point.x - session.pointerStart.x;
    const dy = point.y - session.pointerStart.y;
    const start = session.mode === 'move' ? [x0 + dx, y0 + dy] : (session.mode === 'start' ? [point.x, point.y] : [x0, y0]);
    const end = session.mode === 'move' ? [x1 + dx, y1 + dy] : (session.mode === 'end' ? [point.x, point.y] : [x1, y1]);
    endpoint = '/api/edit-wall';
    body = { model_id: currentModelId, wall_id: session.wall.id, start_cm: start, end_cm: end };
  } else {
    const opening = session.opening;
    const axis = opening.axis_cm || [Math.cos(opening.angle_rad || 0), Math.sin(opening.angle_rad || 0)];
    const delta = (point.x - session.pointerStart.x) * axis[0] + (point.y - session.pointerStart.y) * axis[1];
    endpoint = '/api/move-opening';
    body = {
      model_id: currentModelId,
      opening_id: opening.element_id,
      center_cm: [opening.center_cm[0] + axis[0] * delta, opening.center_cm[1] + axis[1] * delta],
    };
  }
  setStatus('Recalculando paredes, encontros e blocos afetados...');
  try {
    const response = await fetch(endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await response.json();
    if (!response.ok) {
      setStatus((data.edit && data.edit.reason) || data.error || 'A edição foi rejeitada.', true);
      return;
    }
    renderModulationData(data, { edit: data.edit });
    const edit = data.edit || {};
    const affected = (edit.affected_wall_ids || []).length;
    setStatus(`Atualização concluída${affected ? `: ${affected} parede(s) conectada(s) reavaliada(s).` : '.'}`);
  } catch (error) {
    setStatus('Falha ao atualizar a geometria: ' + error, true);
  }
}

canvasEl.addEventListener('pointerdown', event => {
  if (!editSession || event.button !== 0) return;
  const point = worldPointAt(event.clientX, event.clientY);
  if (!point) return;
  event.preventDefault();
  event.stopPropagation();
  editSession.pointerStart = point;
  controls.enabled = false;
  canvasEl.setPointerCapture(event.pointerId);
});

canvasEl.addEventListener('pointermove', event => {
  if (!editSession || !editSession.pointerStart) return;
  const point = worldPointAt(event.clientX, event.clientY);
  if (!point) return;
  const distance = Math.hypot(point.x - editSession.pointerStart.x, point.y - editSession.pointerStart.y);
  setStatus(`Prévia de edição: ${distance.toFixed(1)}cm. Solte para recalcular a modulação.`);
});

canvasEl.addEventListener('pointerup', event => {
  if (!editSession || !editSession.pointerStart) return;
  const point = worldPointAt(event.clientX, event.clientY);
  const session = editSession;
  editSession = null;
  controls.enabled = true;
  if (canvasEl.hasPointerCapture(event.pointerId)) canvasEl.releasePointerCapture(event.pointerId);
  commitInteractiveEdit(session, point);
});

window.addEventListener('keydown', event => {
  if (event.key === 'Escape' && editSession) {
    editSession = null;
    controls.enabled = true;
    setStatus('Edição cancelada.');
  }
});

canvasEl.addEventListener('click', (e) => {
  if (mouseDownPos) {
    const moved = Math.hypot(e.clientX - mouseDownPos[0], e.clientY - mouseDownPos[1]);
    if (moved > 4) return; // foi um drag, nao um clique de selecao
  }
  hideOpeningContextMenu();
  const hit = pickObjectAt(e.clientX, e.clientY);
  if (hit) {
    selectObject(hit.object, hit.instanceId);
  } else {
    clearSelectionHighlight();
    document.getElementById('selection-panel').innerHTML = '';
  }
});

function hideOpeningContextMenu() {
  document.getElementById('opening-context-menu').style.display = 'none';
}

function showOpeningContextMenu(event, openingObj) {
  selectObject(openingObj);
  const menu = document.getElementById('opening-context-menu');
  const rect = viewport.getBoundingClientRect();
  const left = Math.min(event.clientX - rect.left, rect.width - menu.offsetWidth - 8);
  const top = Math.min(event.clientY - rect.top, rect.height - menu.offsetHeight - 8);
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = Math.max(8, top) + 'px';
  menu.style.display = 'block';
}

canvasEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const hit = pickObjectAt(e.clientX, e.clientY);
  if (hit && hit.object.userData.kind === 'opening') {
    showOpeningContextMenu(e, hit.object);
  } else {
    hideOpeningContextMenu();
  }
});

let renderPending = false;
function requestRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    renderer.render(scene, camera);
  });
}
controls.addEventListener('change', requestRender);
requestRender();

window.addEventListener('resize', () => {
  camera.aspect = viewport.clientWidth / viewport.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  requestRender();
});

function setStatus(text, isError) {
  const el = document.getElementById('status');
  el.textContent = text || '';
  el.style.color = isError ? '#ff6b6b' : '#ffb454';
}

function parseLayers() {
  const raw = document.getElementById('wall-layers').value.trim();
  if (!raw) return null;
  return raw.split(',').map(s => s.trim()).filter(Boolean);
}

async function loadLayers() {
  const path = document.getElementById('dxf-path').value.trim();
  if (!path) { setStatus('Informe o caminho do arquivo DXF.', true); return; }
  setStatus('Analisando layers (geometria + nome)...');
  try {
    const unitScaleRaw = document.getElementById('unit-scale').value;
    const unit_scale_to_cm = unitScaleRaw ? parseFloat(unitScaleRaw) : null;
    const res = await fetch('/api/analyze-layers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, expected_layers: parseLayers(), unit_scale_to_cm }),
    });
    const data = await res.json();
    if (!res.ok) { setStatus(data.error || 'Erro ao analisar layers.', true); return; }

    document.getElementById('layers-list').innerHTML = data.layers.map(l => {
      const cls = l.status === 'OK' ? 'ok' : 'atencao';
      const matchLine = l.matched_expected
        ? `Correspondência: ${l.matched_expected} (nome ${Math.round(l.name_score * 100)}%)<br>`
        : '';
      return `<div class="layer-row ${cls}">`
        + `<span class="layer-name">${l.layer}</span><br>`
        + `<span class="layer-detail">${matchLine}`
        + `Confiança geométrica: ${Math.round(l.geometry_score * 100)}% · `
        + `Confiança total: ${Math.round(l.confidence * 100)}% · `
        + `Entidades: ${l.entity_count}</span></div>`;
    }).join('');

    const lowConfidence = data.layers.filter(l => l.status !== 'OK');
    setStatus(
      lowConfidence.length
        ? `${lowConfidence.length} layer(s) com confiança baixa - confira antes de usar (nunca escolha só pelo nome).`
        : ''
    );
  } catch (err) {
    setStatus('Falha ao conectar ao servidor: ' + err, true);
  }
}

function renderOpenings(openings) {
  clearGroup(openingsGroup);
  (openings || []).forEach(op => {
    const [cx, cy] = op.center_cm;
    const w = op.width_cm || 80;
    const thickness = op.wall_thickness_cm || 16;
    const sill = op.sill_cm || 0;
    const head = op.head_cm || 210;
    const h = Math.max(head - sill, 20);
    const cz = sill + h / 2;
    const angle = op.angle_rad || 0;

    const geom = new THREE.BoxGeometry(w, thickness, h);
    const mat = new THREE.MeshLambertMaterial({
      color: 0x00bcd4,
      transparent: true,
      opacity: 0.08,
      depthWrite: false,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(cx, cy, cz);
    mesh.rotation.z = angle;
    mesh.userData = { kind: 'opening', opening: op };
    openingsGroup.add(mesh);

    const edges = new THREE.EdgesGeometry(geom);
    const edgeLine = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00e5ff, opacity: 0.9, transparent: true }));
    edgeLine.position.copy(mesh.position);
    edgeLine.rotation.copy(mesh.rotation);
    openingsGroup.add(edgeLine);
  });
  openingsGroup.visible = document.getElementById('mode-openings').checked;
}

function renderModulationData(data, options = {}) {
  resetWalls();
  currentWalls = data.walls || [];
  currentOpenings = data.openings || [];
  currentBlockCandidates = data.block_candidates || [];
  currentCatalog = data.catalog || {};
  currentModelId = data.model_id || null;
  if (!options.preview) {
    committedViewData = data;
    activePreviewAction = null;
  }
  currentWalls.forEach(addWallBox);
  if (currentBlockCandidates.length) renderSolvedBlocks(currentBlockCandidates);
  renderOpenings(currentOpenings);
  applyWallVisibility();
  blocksGroup.visible = document.getElementById('mode-blocks').checked;
  axesGroup.visible = document.getElementById('mode-axes').checked;
  document.getElementById('selection-panel').innerHTML = '';

  if (data.entities && data.entities.length) {
    currentEntities = data.entities;
    resetPlan();
    currentEntities.forEach(addPlanEntity);
    buildLayerToggles(currentEntities);
    planGroup.visible = document.getElementById('mode-plan').checked;
  }

  frameCamera(currentWalls, currentEntities);

  const closesCount = currentWalls.filter(w => w.modulation && w.modulation.closes).length;
  const solver = data.block_diagnostics || {};
  let summaryText;
  if (data.source_mode === 'revit_walls' && solver.status === 'ok') {
    const conflicts = solver.partial_recalculation
      ? (solver.wall_statuses || []).filter(status => status.ok === false).length
      : (solver.collision_count || 0) + (solver.non_modular_count || 0) + (solver.jamb_exception_count || 0);
    summaryText = `${currentWalls.length} parede(s) contínua(s) · ${solver.candidate_count || 0} bloco(s) resolvido(s).`;
    summaryText += conflicts ? `\n${conflicts} conflito(s) do solver exigem ajuste.` : '\nModulação validada sem conflitos pelo solver.';
    if (solver.partial_recalculation) summaryText += '\nRecalculada somente a faixa de nível/base alterada.';
  } else {
    summaryText = `${currentWalls.length} parede(s) — ${closesCount} fecham em blocos, ${currentWalls.length - closesCount} precisam de ajuste.`;
  }
  if (currentOpenings.length) summaryText += `\n${currentOpenings.length} abertura(s) capturada(s).`;
  if (data.source) summaryText += `\nProjeto: ${data.source}`;
  if (data.level) summaryText += ` · Nível: ${data.level}`;
  if (data.source_mode === 'revit_walls') summaryText += `\nBase geométrica: Walls existentes do Revit.`;
  if (options.adjustment && options.adjustment.actions) {
    const openingAdjustments = options.adjustment.actions.filter(a => a.accepted && a.opening_id).length;
    const wallAdjustments = options.adjustment.actions.filter(a => a.status === 'adjusted').length;
    if (openingAdjustments) summaryText += `\n${openingAdjustments} abertura(s) ajustada(s) e revalidada(s).`;
    else if (wallAdjustments) summaryText += `\n${wallAdjustments} parede(s) corrigida(s) no preview.`;
  }
  if (options.edit) {
    const affected = (options.edit.affected_wall_ids || []).length;
    summaryText += `\nEdição dinâmica aplicada${affected ? ` · ${affected} parede(s) conectada(s) afetada(s)` : ''}.`;
  }
  document.getElementById('summary').textContent = summaryText;

  const validation = data.validation || { issues: [] };
  document.getElementById('validation-banner').textContent = validation.issues.length
    ? validation.issues.join('\n')
    : '';

  document.getElementById('btn-auto-adjust').disabled = !currentModelId;
  requestRender();
}

async function loadModulation() {
  const path = document.getElementById('dxf-path').value.trim();
  if (!path) { setStatus('Informe o caminho do arquivo.', true); return; }
  setStatus('Calculando modulação...');
  document.getElementById('validation-banner').textContent = '';
  try {
    const unitScaleRaw = document.getElementById('unit-scale').value;
    const unit_scale_to_cm = unitScaleRaw ? parseFloat(unitScaleRaw) : null;
    const res = await fetch('/api/load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, layers: parseLayers(), unit_scale_to_cm }),
    });
    const data = await res.json();
    if (!res.ok) { setStatus(data.error || 'Erro ao processar o arquivo.', true); return; }

    if (data.entities && data.entities.length) {
      currentEntities = data.entities;
    } else {
      await loadPlanEntities(unit_scale_to_cm);
    }
    renderModulationData(data);

    setStatus((data.warnings || []).join('\n'));
  } catch (err) {
    setStatus('Falha ao conectar ao servidor: ' + err, true);
  }
}

async function loadPlanEntities(unit_scale_to_cm) {
  const path = document.getElementById('dxf-path').value.trim();
  if (!path) return;
  try {
    const res = await fetch('/api/entities', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, unit_scale_to_cm, layers: parseLayers() }),
    });
    const data = await res.json();
    if (!res.ok) return;
    currentEntities = data.entities;
    resetPlan();
    currentEntities.forEach(addPlanEntity);
    buildLayerToggles(currentEntities);
    planGroup.visible = document.getElementById('mode-plan').checked;
  } catch (err) {
    // planta baixa e' so' referencia visual - falha aqui nao trava o resto.
    console.warn('Falha ao carregar planta baixa de referência:', err);
  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function pickAndConvertDwg() {
  const btn = document.getElementById('btn-pick-dwg');
  btn.disabled = true;
  try {
    setStatus('Selecionando arquivo...');
    const pickRes = await fetch('/api/pick-dwg', { method: 'POST' });
    const pickData = await pickRes.json();
    if (!pickRes.ok) { setStatus(pickData.error || 'Erro ao abrir o seletor de arquivos.', true); return; }
    if (!pickData.path) { setStatus('Seleção cancelada.'); return; }

    setStatus('DWG selecionado: ' + pickData.path);
    await sleep(400);

    setStatus('Convertendo com ODA...');
    const convRes = await fetch('/api/convert-dwg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: pickData.path }),
    });
    const convData = await convRes.json();
    if (!convRes.ok) { setStatus(convData.error || 'Erro ao converter o DWG com o ODA.', true); return; }

    setStatus('Conversão concluída');
    document.getElementById('dxf-path').value = convData.dxf_path;
    await sleep(400);

    setStatus('DXF pronto para utilização');
    await loadModulation();
  } catch (err) {
    setStatus('Falha ao conectar ao servidor: ' + err, true);
  } finally {
    btn.disabled = false;
  }
}

async function pickJsonCapture() {
  const btn = document.getElementById('btn-pick-json');
  btn.disabled = true;
  try {
    setStatus('Selecionando arquivo JSON...');
    const res = await fetch('/api/pick-json', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { setStatus(data.error || 'Erro ao abrir seletor.', true); return; }
    if (!data.path) { setStatus('Seleção cancelada.'); return; }
    document.getElementById('dxf-path').value = data.path;
    await loadModulation();
  } catch (err) {
    setStatus('Falha ao conectar: ' + err, true);
  } finally {
    btn.disabled = false;
  }
}

async function adjustSelectedOpening(mode, deltaCm = null, preview = false) {
  if (!currentModelId || (mode === 'manual' && !selectedOpeningId)) {
    setStatus(mode === 'manual' ? 'Selecione uma abertura da captura do Revit.' : 'Carregue uma captura do Revit.', true);
    return;
  }
  const btn = document.getElementById('btn-auto-adjust');
  btn.disabled = true;
  setStatus(preview ? 'Gerando preview validado pelo solver...' : (mode === 'auto' ? 'Testando ajustes permitidos com o solver...' : 'Validando ajuste manual com o solver...'));
  try {
    const res = await fetch('/api/adjust-opening', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model_id: currentModelId,
        opening_id: (mode === 'manual' || selectedOpeningId) ? selectedOpeningId : null,
        mode,
        delta_cm: deltaCm,
        preview,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      const reason = data.adjustment && data.adjustment.reason;
      setStatus(reason || data.error || 'O solver rejeitou o ajuste.', true);
      return;
    }
    const action = data.adjustment || {};
    const actions = Array.isArray(action.actions) ? action.actions : [action];
    renderModulationData(data, { adjustment: { actions }, preview });
    if (preview) {
      activePreviewAction = { mode, deltaCm, openingId: selectedOpeningId };
      setStatus('Preview calculado e validado. Use Aplicar preview ou Cancelar preview no menu da abertura.');
      return;
    }
    if (Array.isArray(action.actions)) {
      const accepted = action.actions.filter(item => item.accepted);
      const changes = accepted.map(item => `${item.opening_id}: ${item.delta_cm > 0 ? '+' : ''}${item.delta_cm}cm`).join(', ');
      setStatus(`${accepted.length} abertura(s) ajustada(s) e validadas pelo solver.${changes ? '\n' + changes : ''}`);
    } else {
      setStatus(`Abertura ${action.opening_id} movida ${action.delta_cm > 0 ? '+' : ''}${action.delta_cm}cm. Modulação recalculada e validada.`);
    }
  } catch (err) {
    setStatus('Falha ao validar o ajuste: ' + err, true);
  }
}

function cancelOpeningPreview() {
  if (!committedViewData) return;
  renderModulationData(committedViewData);
  activePreviewAction = null;
  setStatus('Preview cancelado.');
}

async function applyOpeningPreview() {
  if (!activePreviewAction) {
    setStatus('Nenhum preview ativo para aplicar.', true);
    return;
  }
  selectedOpeningId = activePreviewAction.openingId;
  await adjustSelectedOpening(activePreviewAction.mode, activePreviewAction.deltaCm, false);
}

document.getElementById('btn-pick-dwg').addEventListener('click', pickAndConvertDwg);
document.getElementById('btn-pick-json').addEventListener('click', pickJsonCapture);
document.getElementById('btn-layers').addEventListener('click', loadLayers);
document.getElementById('btn-load').addEventListener('click', loadModulation);
document.getElementById('btn-auto-adjust').addEventListener('click', () => adjustSelectedOpening('auto'));
document.getElementById('selection-panel').addEventListener('click', (event) => {
  const wallButton = event.target.closest('[data-wall-edit]');
  if (wallButton) {
    beginWallEdit(wallButton.dataset.wallEdit);
    return;
  }
  const openingEditButton = event.target.closest('[data-opening-edit]');
  if (openingEditButton) {
    beginOpeningEdit();
    return;
  }
  const button = event.target.closest('[data-opening-shift]');
  if (button) adjustSelectedOpening('manual', parseFloat(button.dataset.openingShift));
});
document.getElementById('opening-context-menu').addEventListener('click', async (event) => {
  const previewButton = event.target.closest('[data-opening-preview]');
  if (previewButton) {
    const value = previewButton.dataset.openingPreview;
    hideOpeningContextMenu();
    if (value === 'auto') await adjustSelectedOpening('auto', null, true);
    else await adjustSelectedOpening('manual', parseFloat(value), true);
    return;
  }
  if (event.target.closest('[data-opening-apply-preview]')) {
    hideOpeningContextMenu();
    await applyOpeningPreview();
    return;
  }
  if (event.target.closest('[data-opening-cancel-preview]')) {
    hideOpeningContextMenu();
    cancelOpeningPreview();
  }
});

document.getElementById('view-top').addEventListener('click', () => setView('top'));
document.getElementById('view-front').addEventListener('click', () => setView('front'));
document.getElementById('view-side').addEventListener('click', () => setView('side'));
document.getElementById('view-iso').addEventListener('click', () => setView('iso'));
document.getElementById('view-extents').addEventListener('click', () => frameCamera(currentWalls, currentEntities));

document.getElementById('mode-plan').addEventListener('change', e => { planGroup.visible = e.target.checked; requestRender(); });
document.getElementById('mode-walls').addEventListener('change', applyWallVisibility);
document.getElementById('mode-errors').addEventListener('change', applyWallVisibility);
document.getElementById('mode-blocks').addEventListener('change', e => { blocksGroup.visible = e.target.checked; requestRender(); });
document.getElementById('mode-openings').addEventListener('change', e => { openingsGroup.visible = e.target.checked; requestRender(); });
document.getElementById('mode-axes').addEventListener('change', e => { axesGroup.visible = e.target.checked; requestRender(); });

// Auto-carrega captura ou arquivo se passado via query param ?capture=... ou ?file=...
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const capture = params.get('capture') || params.get('file');
  if (capture) {
    document.getElementById('dxf-path').value = decodeURIComponent(capture);
    loadModulation();
  }
});
</script>
